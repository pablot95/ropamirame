<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Mírame</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart-style.css"> 
</head>
<body>
    <div class="navigation-wrapper">
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="index.html#collection">Colección</a></li>
                    <li><a href="cart.html" class="active">Carrito</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <div class="container cart-container">
        <h1>Tu Carrito</h1>
        
        <div id="empty-cart-msg" style="display: none;">
            <p>Tu carrito está vacío.</p>
            <a href="index.html#collection" class="btn-primary">Ir a comprar</a>
        </div>

        <div class="cart-content" id="cart-content">
            <div class="cart-items" id="cart-items">
                <!-- JS fills this -->
            </div>

            <div class="cart-summary">
                <h2>Resumen</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">$0</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">$0</span>
                </div>
                <!-- Redirects to checkout page -->
                <a href="checkout.html" class="btn-primary checkout-btn">Finalizar Compra</a>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
