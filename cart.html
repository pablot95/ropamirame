<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Mírame</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart-style.css"> 
    <link rel="stylesheet" href="cart-icon.css">
</head>
<body>
    <div class="navigation-wrapper">
        <div class="logo-container">
            <a href="index.html"><img src="images/logofondoblanco.jpeg" alt="Mírame Logo" class="brand-logo"></a>
        </div>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="index.html#collection">Colección</a></li>
                    <li>
                        <a href="cart.html" class="active cart-widget">
                            <svg xmlns="http://www.w3.org/2000/svg" class="cart-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span id="cart-count" class="cart-count-badge">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </header>
    </div>

    <div class="container cart-container">
        <h1>Tu Carrito</h1>
        
        <div id="empty-cart-msg" style="display: none;">
            <p>Tu carrito está vacío.</p>
            <a href="index.html#collection" class="btn-primary">Ir a comprar</a>
        </div>

        <div class="cart-content" id="cart-content">
            <div class="cart-items" id="cart-items">
            </div>

            <div class="cart-summary">
                <h2>Resumen</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">$0</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">$0</span>
                </div>
                <a href="checkout.html" class="btn-primary checkout-btn">Finalizar Compra</a>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
