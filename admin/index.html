<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Mirame</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../admin/panel.css">
</head>
<body>
    <header>
        <h1>Panel de Administración</h1>
        <nav>
            <a href="../index.html">Ir a la tienda</a>
        </nav>
    </header>

    <div class="admin-container">
        <!-- Formulario de Agregar/Editar Producto -->
        <section class="admin-section">
            <h2 id="form-title">Agregar Nuevo Producto</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="form-group">
                    <label for="name">Nombre del Producto:</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="category">Categoría:</label>
                    <select id="category" required>
                        <option value="remeras">Remera</option>
                        <option value="sweaters">Sweaters</option>
                        <option value="pantalones">Pantalón</option>
                        <option value="shorts">Short</option>
                        <option value="camperas">Camperas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Descripción:</label>
                    <textarea id="description" required></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Precio ($):</label>
                    <input type="number" id="price" required min="0">
                </div>

                <div class="form-group">
                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" required min="0">
                </div>

                <!-- Selección de Talles -->
                <div class="form-group">
                    <label>Talles Disponibles:</label>
                    <div class="sizes-container">
                        <div class="size-group">
                            <p>Letras:</p>
                            <div class="checkbox-group" id="sizes-letters">
                                <!-- JS llenará esto -->
                            </div>
                        </div>
                        <div class="size-group">
                            <p>Números (1-7):</p>
                            <div class="checkbox-group" id="sizes-numbers">
                                <!-- JS llenará esto -->
                            </div>
                        </div>
                        <div class="size-group">
                            <p>Números (36-54):</p>
                            <div class="checkbox-group" id="sizes-large">
                                <!-- JS llenará esto -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Selección de Colores -->
                <div class="form-group">
                    <label>Colores Disponibles:</label>
                    <div class="colors-container" id="colors-container">
                        <!-- JS llenará esto -->
                    </div>
                </div>

                <!-- Imágenes -->
                <div class="form-group">
                    <label for="images">Imágenes:</label>
                    <input type="file" id="images" multiple accept="image/*">
                    <div id="image-preview-container" class="image-preview-grid">
                        <!-- Las imágenes seleccionadas y existentes aparecerán aquí -->
                    </div>
                </div>

                <button type="submit" id="submit-btn">Guardar Producto</button>
                <button type="button" id="cancel-btn" style="display: none;">Cancelar Edición</button>
            </form>
        </section>

        <!-- Listado de Productos -->
        <section class="admin-section">
            <h2>Listado de Productos</h2>
            <div id="products-list" class="admin-products-grid">
                <!-- Los productos se cargarán aquí -->
            </div>
        </section>
    </div>

    <script type="module" src="../admin/panel.js"></script>
</body>
</html>
